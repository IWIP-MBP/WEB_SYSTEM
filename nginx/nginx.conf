worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 100M;

    server {
        listen       80;
        server_name  localhost;

        # --- 0. 统一微服务导航门户 (首选首页直达，内外网一致) ---
        location = / {
            root /usr/share/nginx/html/portal;
            index index.html;
            try_files /index.html =404;
        }

        location /portal/ {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /portal/index.html =404;
        }

        # --- 1. 人事系统后端 API 分流 ---
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- 2. WebSocket 长连接支持 ---
        location /ws/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # --- 3. 人事管理系统独立分流 (Streamlit /hr/) ---
        location = /hr {
            return 301 /hr/;
        }

        location /hr/ {
            proxy_pass http://frontend:8501/hr/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # --- 4. 健身房管理系统独立分流 (完全解耦，不影响其他系统) ---
        location = /gym {
            return 301 /gym/;
        }

        location /gym/ {
            proxy_pass http://host.docker.internal:5050/gym/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /gym;
            proxy_read_timeout 3600;
        }

        # --- 5. 电梯故障排查系统独立分流 (完全解耦) ---
        location = /elevator {
            return 301 /elevator/;
        }

        location /elevator/ {
            root /usr/share/nginx/html;
            charset utf-8;
            index index.html Elevator_Workbench.html 电梯故障快速定位与排查工作台.html;
            try_files $uri $uri/ /elevator/index.html =404;
        }

        # --- 6. 后勤三部信息中心 (智能物流配送系统 V3，完全解耦) ---
        location = /logistics {
            return 301 /logistics/;
        }

        location /logistics/ {
            proxy_pass http://host.docker.internal:9380/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/ {
            proxy_pass http://host.docker.internal:9300/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
            client_max_body_size 20M;
        }

        location /assets/ {
            proxy_pass http://host.docker.internal:9380/assets/;
            proxy_set_header Host $host;
        }

        location /logistics-files/ {
            proxy_pass http://host.docker.internal:9390/logistics-files/;
            proxy_set_header Host minio:9000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
        }

        # 错误页面处理
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
