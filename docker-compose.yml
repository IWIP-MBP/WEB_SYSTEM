name: web_system

services:
  db:
    image: postgres:15
    container_name: hr_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iwip123}
      POSTGRES_DB: ${POSTGRES_DB:-hr_system}
      TZ: ${TZ:-Asia/Tokyo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "tcp_keepalives_idle=60"
      - "-c"
      - "tcp_keepalives_interval=10"
      - "-c"
      - "tcp_keepalives_count=6"
      - "-c"
      - "idle_in_transaction_session_timeout=300000"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-hr_system}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: hr_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-iwip123}@db:5432/${POSTGRES_DB:-hr_system}
      SECRET_KEY: ${SECRET_KEY:-iwip-secret-key-change-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      TZ: ${TZ:-Asia/Tokyo}
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./backups:/app/backups
      - ./routers:/app/routers
      - ./services:/app/services
      - ./main.py:/app/main.py
      - ./models.py:/app/models.py
      - ./database.py:/app/database.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - default

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: hr_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - API_BASE=http://hr_backend:8000/api
      - TZ=${TZ:-Asia/Tokyo}
      - STREAMLIT_SERVER_BASE_URL_PATH=hr
    ports:
      - "8501:8501"
    volumes:
      - ./uploads:/app/uploads
      - ./ui.py:/app/ui.py
      - ./components:/app/components
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/hr/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - default

  backend_dept2:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: hr_backend_dept2
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-iwip123}@db:5432/${POSTGRES_DB_DEPT2:-hr_system_dept2}
      SECRET_KEY: ${SECRET_KEY:-iwip-secret-key-change-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      TZ: ${TZ:-Asia/Tokyo}
      DEPT_NAME: ACC5
    ports:
      - "8001:8000"
    volumes:
      - ./uploads_dept2:/app/uploads
      - ./backups_dept2:/app/backups
      - ./routers:/app/routers
      - ./services:/app/services
      - ./main.py:/app/main.py
      - ./models.py:/app/models.py
      - ./database.py:/app/database.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - default

  frontend_dept2:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: hr_frontend_dept2
    restart: always
    depends_on:
      backend_dept2:
        condition: service_healthy
    environment:
      - API_BASE=http://hr_backend_dept2:8000/api
      - API_PREFIX=/api-dept2
      - WS_PREFIX=/ws-dept2
      - TZ=${TZ:-Asia/Tokyo}
      - STREAMLIT_SERVER_BASE_URL_PATH=hr-dept2
      - DEPT_NAME=ACC5
    ports:
      - "8502:8501"
    volumes:
      - ./uploads_dept2:/app/uploads
      - ./ui.py:/app/ui.py
      - ./components:/app/components
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/hr-dept2/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - default

  nginx:
    image: nginx:alpine
    container_name: hr_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./portal:/usr/share/nginx/html/portal:ro
      - ../elevator_fault:/usr/share/nginx/html/elevator:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      backend_dept2:
        condition: service_healthy
      frontend_dept2:
        condition: service_healthy
    networks:
      - default
      - logistics-shared-net

  ngrok:
    image: ngrok/ngrok:latest
    container_name: hr_ngrok
    restart: always
    volumes:
      - ./ngrok.yml:/var/lib/ngrok/ngrok.yml:ro
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
    command:
      - "http"
      - "nginx:80"
      - "--url=${NGROK_DOMAIN:-civil-grueling-enigmatic.ngrok-free.dev}"
      - "--pooling-enabled"
    depends_on:
      - nginx
    networks:
      - default

volumes:
  postgres_data:

networks:
  default:
  logistics-shared-net:
    name: logistics-shared-net
    external: true
